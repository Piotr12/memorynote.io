# Kamal app for the dev environment: dev.memorynote.io.
# Deploy with: kamal deploy -C kamal-dev.yml
# See docs/deployment.md for the pipeline.

service: memorynote-dev

image: memorynote-dev

registry:
  # The registry runs on the deploy host; it is unauthenticated because the
  # image holds no credentials. Kamal requires these keys for non-localhost
  # registries; docker login never challenges them.
  server: 146.59.105.8:5000
  username: anonymous
  password: unauthenticated

servers:
  - 146.59.105.8

proxy:
  hosts:
    - dev.memorynote.io

builder:
  arch: amd64
  args:
    ENVIRONMENT: dev

ssh:
  user: debian
  keys:
    - /home/runner/.ssh/deploy_key
